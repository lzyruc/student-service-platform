# 学业 Agent 运行设置。API Key / 地址 / 模型与政策问答共用 python-services/.env。
# 从 backend 启动；更换配置文件可填写绝对路径，Windows 路径建议使用 /。
agent.deepseek.env-file=${AGENT_ENV_FILE:../python-services/.env}
agent.deepseek.api-key=${DEEPSEEK_API_KEY:}
agent.deepseek.base-url=${DEEPSEEK_BASE_URL:}
agent.deepseek.model=${DEEPSEEK_MODEL:}
agent.deepseek.connect-timeout=5s
agent.deepseek.read-timeout=60s
agent.deepseek.max-output-tokens=2048

# 一轮是一条模型消息提出的一批工具调用。上限后不再执行工具。
agent.max-tool-rounds=4
agent.max-tool-calls=12
agent.request-timeout=180s

# Academic Skill 可信提示词文件：启动时读取，修改后重启后端。默认源文件缺失时使用 JAR 内资源。
agent.academic.prompt-file=${ACADEMIC_SKILL_PROMPT_FILE:./src/main/resources/agent/skills/academic.md}
