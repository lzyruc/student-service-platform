server.port=8081
spring.application.name=student-service-platform

external.ai-service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
external.warning-service.base-url=${WARNING_SERVICE_BASE_URL:http://127.0.0.1:8002}
external.http.connect-timeout=${EXTERNAL_CONNECT_TIMEOUT:3s}
external.http.read-timeout=${EXTERNAL_READ_TIMEOUT:30s}
external.http.max-attempts=${EXTERNAL_MAX_ATTEMPTS:2}

spring.datasource.driver-class-name=com.kingbase8.Driver
spring.datasource.url=${DB_URL:jdbc:kingbase8://localhost:54321/student_platform}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 至少 32 个 UTF-8 字节；生产环境必须使用随机值并通过环境变量注入。
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:student-service-platform}
security.jwt.ttl=${JWT_TTL:24h}
security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
security.default-student-password=${DEFAULT_STUDENT_PASSWORD:}
security.bootstrap-admin.username=${ADMIN_BOOTSTRAP_USERNAME:admin}
security.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# 逗号分隔。启用凭据时不能使用通配符 *。
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
